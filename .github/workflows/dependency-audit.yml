name: Dependency Advisory Inventory (Read-Only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/report-dependency-risk.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Read npm advisory inventory (no install or package updates)
        run: |
          npm audit --json > dependency-audit.json || true
          node scripts/report-dependency-risk.mjs dependency-audit.json

      - name: Save raw audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-inventory
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 7

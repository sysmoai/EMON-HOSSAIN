name: Astro 7 Migration Bootstrap (Temporary Isolated Branch)

on:
  push:
    branches:
      - security/astro7-2026-11-03
    paths:
      - .github/workflows/astro7-migration-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: astro7-bootstrap-isolated
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'sysmoai/EMON-HOSSAIN' && github.ref == 'refs/heads/security/astro7-2026-11-03'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact security branch without retained credentials
        uses: actions/checkout@v4
        with:
          ref: security/astro7-2026-11-03
          persist-credentials: false
          fetch-depth: 1

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Record baseline
        run: |
          node --version
          npm --version
          git rev-parse HEAD
          npm pkg get dependencies.astro

      - name: Resolve pinned Astro 7.4.4 and regenerate package-lock without scripts
        run: npm install astro@7.4.4 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install candidate from regenerated lockfile
        run: npm ci --no-fund

      - name: Build static candidate
        run: npm run build

      - name: Recheck public-claim release gate
        run: node scripts/verify-release.mjs --built

      - name: Recheck AI solution pages
        run: node scripts/verify-solutions.mjs

      - name: Recheck sitemap, headings, metadata and local links
        run: node scripts/verify-site-integrity.mjs

      - name: Inventory dependency advisories after upgrade
        run: |
          npm audit --json > npm-audit-astro7.json || true
          node -e 'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync("npm-audit-astro7.json","utf8"));if(!x.metadata?.vulnerabilities)process.exit(1);console.log("Astro 7 advisory counts:",JSON.stringify(x.metadata.vulnerabilities));'

      - name: Commit pinned package and lockfile only on isolated branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test "$(git branch --show-current)" = "security/astro7-2026-11-03"
          node -e 'const p=require("./package.json");const l=require("./package-lock.json");if(p.dependencies.astro!=="7.4.4"||l.packages[""].dependencies.astro!=="7.4.4"||l.packages["node_modules/astro"].version!=="7.4.4")process.exit(1)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package updates to commit"
            exit 0
          fi
          git commit -m 'chore(security): pin Astro 7.4.4 and regenerate dependency lockfile'
          HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $HEADER" push origin HEAD:refs/heads/security/astro7-2026-11-03

      - name: Save audit evidence and candidate dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astro7-migration-evidence
          path: |
            package.json
            package-lock.json
            npm-audit-astro7.json
          if-no-files-found: warn
          retention-days: 7

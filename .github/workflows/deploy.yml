name: Deploy EMON-HOSSAIN (CF Pages)
on:
  push:
    branches: [main]
    paths: ['apps/EMON-HOSSAIN/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm', cache-dependency-path: apps/EMON-HOSSAIN/pnpm-lock.yaml }
      - run: cd apps/EMON-HOSSAIN && pnpm install --frozen-lockfile && pnpm build
      - uses: cloudflare/wrangler-action@v3
        with: { apiToken: '${{ secrets.CF_API_TOKEN }}', accountId: '${{ secrets.CF_ACCOUNT_ID }}', command: 'pages deploy apps/EMON-HOSSAIN/dist --project-name=emonhossain-pro --branch=main' }

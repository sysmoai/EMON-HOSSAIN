name: Verify Astro Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify release output and public claims
        run: node scripts/verify-release.mjs --built

      - name: Save deployable static output
        uses: actions/upload-artifact@v4
        with:
          name: emonhossain-pro-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

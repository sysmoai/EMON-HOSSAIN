name: Astro 7 Secure Static Release Gate

on:
  push:
    branches:
      - security/astro7-2026-11-03
  pull_request:
    branches:
      - main
      - release/integrated-2026-11-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin supported Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify clean lockfile dependency versions
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(p.dependencies.astro!=="7.4.4"||l.packages["node_modules/astro"].version!=="7.4.4"){process.exit(1)}const vite=l.packages["node_modules/vite"];if(!vite||!vite.version.startsWith("8.")){console.error("Unexpected Vite dependency",vite?.version);process.exit(1)}console.log("Pinned Astro",p.dependencies.astro,"Vite",vite.version);'

      - name: Install exact locked dependencies
        run: npm ci --no-fund

      - name: Build static site
        run: npm run build

      - name: Run release content truth gate
        run: node scripts/verify-release.mjs --built

      - name: Run AI solution route QA
        run: node scripts/verify-solutions.mjs

      - name: Run full-site link, metadata, heading and sitemap QA
        run: node scripts/verify-site-integrity.mjs

      - name: Require zero npm advisory findings
        run: npm audit --audit-level=low

      - name: Package static preview for manual visual QA (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: astro7-static-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

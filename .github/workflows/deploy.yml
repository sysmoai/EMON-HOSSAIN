name: Verify EMON HOSSAIN Site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Astro output
        run: test -f dist/index.html

# Production deployment is intentionally disabled until the actual
# emonhossain.pro hosting project, credentials, output directory, and rollback
# path are verified. Deployment should be a separate gated job.
